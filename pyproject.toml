[project]
name = "llm-review"
version = "0.1.0"
description = "Multi-agent simulation of scientific peer review"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.24",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.3",
]

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "test"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
# Exclude modules that are only imported (not yet unit-tested) so the coverage
# percentage reflects what we actually test. Remove an entry once it has tests.
omit = [
    "*/main.py",
    "*/config.py",
    "*/domain/models/ranges.py",
]
